<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colinas del Portal PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #eceff1; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #b71c1c; text-align: center; margin-bottom: 5px; font-size: 1.7rem; }
        .subtitle { text-align: center; color: #607d8b; margin-bottom: 20px; font-size: 0.9rem; }
        .btn-call { background: #1565c0; color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; border: 2px solid #0d47a1; }
        .nota-informativa { background-color: #fff9c4; padding: 12px; border-radius: 10px; border-left: 5px solid #fbc02d; font-size: 0.85rem; color: #574b00; margin: 15px 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #37474f; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #cfd8dc; border-radius: 10px; box-sizing: border-box; background: #fafafa; font-size: 1rem; }
        button { background: #2e7d32; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 1.1rem; cursor: pointer; margin-top: 25px; font-weight: bold; }
        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #ddd; }
        footer { text-align: center; margin-top: 40px; padding: 20px; font-size: 0.8rem; color: #78909c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Colinas del Portal</h1>
    <p class="subtitle">Gestión Comunitaria</p>
    
    <a href="https://haroldco45.github.io/cuadrantescaucasia/" target="_blank" class="btn-call">📞 VER CUADRANTES Y LLAMAR</a>

    <div class="nota-informativa">
        <strong>IMPORTANTE:</strong> WhatsApp no permite enviar la foto automáticamente. La app enviará el texto, y usted deberá adjuntar la foto manualmente en el chat presionando el clip 📎.
    </div>

    <form id="reporteForm">
        <label>WhatsApp Destino (Sin el 57):</label>
        <input type="tel" id="whatsapp_destino" placeholder="Ej: 3101234567" required>

        <label>Asunto:</label>
        <select id="tipo" required>
            <option value="Inseguridad">🚨 Inseguridad</option>
            <option value="Mascota">🐶 Mascota Perdida</option>
            <option value="Riña">🔊 Pelea / Ruido</option>
            <option value="Vivienda">🏠 Apartamento / Arriendo</option>
        </select>

        <label>Descripción:</label>
        <textarea id="descripcion" rows="4" placeholder="¿Qué está pasando?" required></textarea>

        <!-- Se quitó 'capture' para que el celular deje elegir entre GALERÍA o CÁMARA -->
        <label>Adjuntar Foto de Evidencia:</label>
        <input type="file" id="foto" accept="image/*">
        <img id="preview" src="#" alt="Vista previa">

        <input type="hidden" id="coords">
        <button type="submit">ENVIAR A WHATSAPP</button>
    </form>
</div>

<footer>
    Hecha por <strong>VIBRAS POSITIVAS HM</strong><br>
    Derechos de Autor Reservados © 2026
</footer>

<script>
    // Registro Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    // Geolocalización Obligatoria
    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('coords').value = `${pos.coords.latitude},${pos.coords.longitude}`;
            });
        }
    };

    // Lógica de Previsualización (Para que el vecino vea la foto en la app antes de enviar)
    document.getElementById('foto').onchange = function (e) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const img = document.getElementById('preview');
            img.src = event.target.result;
            img.style.display = 'block';
        };
        if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('reporteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const destino = document.getElementById('whatsapp_destino').value;
        const tipo = document.getElementById('tipo').value;
        const detalle = document.getElementById('descripcion').value;
        const gps = document.getElementById('coords').value || "No compartida";
        const fecha = new Date().toLocaleString();
        
        const mensaje = `*REPORTE COLINAS DEL PORTAL*%0A%0A` +
                        `*Asunto:* ${tipo}%0A` +
                        `*Detalle:* ${detalle}%0A` +
                        `*Ubicación:* http://maps.google.com/?q=${gps}%0A` +
                        `*Fecha:* ${fecha}%0A%0A` +
                        `_Enviado desde la App PWA Colinas_`;
        
        window.open(`https://wa.me/57${destino}?text=${mensaje}`, '_blank');
    });
</script>
</body>
</html>
