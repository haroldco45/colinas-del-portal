<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colinas del Portal - Convivencia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #eceff1; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #b71c1c; text-align: center; margin-bottom: 5px; font-size: 1.7rem; }
        .subtitle { text-align: center; color: #607d8b; margin-bottom: 20px; font-size: 0.9rem; }
        .btn-call { background: #1565c0; color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; border: 2px solid #0d47a1; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #37474f; }
        select, textarea, input[type="file"] { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #cfd8dc; border-radius: 10px; box-sizing: border-box; background: #fafafa; }
        button { background: #2e7d32; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 1.1rem; cursor: pointer; margin-top: 25px; font-weight: bold; transition: 0.3s; }
        button:active { transform: scale(0.98); background: #1b5e20; }
        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #ddd; }
        footer { text-align: center; margin-top: 40px; padding: 20px; font-size: 0.8rem; color: #78909c; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Colinas del Portal</h1>
    <p class="subtitle">Reportes de Seguridad y Convivencia</p>
    
    <!-- Enlace directo a la página de llamadas -->
    <a href="https://haroldco45.github.io/cuadrantescaucasia/" target="_blank" class="btn-call">📞 VER CUADRANTES Y LLAMAR</a>

    <form id="reporteForm">
        <label>Asunto del reporte:</label>
        <select id="tipo" required>
            <option value="Inseguridad">🚨 Inseguridad / Sospechosos</option>
            <option value="Riña">🔊 Pelea / Ruido Excesivo</option>
            <option value="Mascota">🐶 Mascota Perdida</option>
            <option value="Vivienda">🔑 Busco/Arriendo Apartamento</option>
            <option value="Comunitaria">📋 Queja o Sugerencia</option>
        </select>

        <label>Detalles:</label>
        <textarea id="descripcion" rows="4" placeholder="¿Qué está pasando?" required></textarea>

        <label>Evidencia Visual (Foto):</label>
        <input type="file" id="foto" accept="image/*" capture="environment">
        <img id="preview" src="#" alt="Vista previa de evidencia">

        <input type="hidden" id="coords">
        
        <button type="submit">PUBLICAR REPORTE</button>
    </form>
</div>

<footer>
    Hecha por <strong>VIBRAS POSITIVAS HM</strong><br>
    Derechos de Autor Reservados © 2026
</footer>

<script>
    // Registro Service Worker para PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
        });
    }

    // Captura de Coordenadas (GPS)
    window.onload = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('coords').value = `${pos.coords.latitude},${pos.coords.longitude}`;
            }, () => { console.log("GPS no activado"); });
        }
    };

    // Previsualización de Foto
    document.getElementById('foto').onchange = function (e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = document.getElementById('preview');
                img.src = event.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    };

    // Almacenamiento y WhatsApp
    document.getElementById('reporteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            tipo: document.getElementById('tipo').value,
            detalle: document.getElementById('descripcion').value,
            gps: document.getElementById('coords').value || "Ubicación no compartida",
            hora: new Date().toLocaleString()
        };

        // Guardar localmente
        let localData = JSON.parse(localStorage.getItem('colinas_data')) || [];
        localData.push(data);
        localStorage.setItem('colinas_data', JSON.stringify(localData));

        // WhatsApp a tu número registrado
        const mensaje = `*COLINAS DEL PORTAL*%0A` +
                        `*Reporte:* ${data.tipo}%0A` +
                        `*Detalle:* ${data.detalle}%0A` +
                        `*GPS:* https://www.google.com/maps?q=${data.gps}%0A` +
                        `*Hora:* ${data.hora}`;
        
        window.open(`https://wa.me/573104131557?text=${mensaje}`, '_blank');
        this.reset();
        document.getElementById('preview').style.display = 'none';
        alert('Reporte enviado con éxito.');
    });
</script>

</body>
</html>
